[project]
name = "kis-trading-template"
version = "0.9.0"
description = "Korean stock auto-trading framework template using KIS API"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["RoboTrader_template/tests"]
asyncio_mode = "auto"
# db 표식 시험(실 DB kis_template 필요 · 일부는 쓰기)은 기본 제외 — CLI 의 -m 이 이 값을 덮는다(돌리려면 -m db)
addopts = "-m 'not db'"
markers = [
    "slow: 느린 테스트 (DB 대량 조회 등) — pytest -m 'not slow' 로 제외",
    "db: 실 DB(kis_template @ localhost:5433) 필요(일부 쓰기) — 기본 제외(addopts -m 'not db') · 돌리려면 -m db",
]
